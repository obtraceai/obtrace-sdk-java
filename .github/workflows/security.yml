name: Security

on:
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: obtrace-runners
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4

  audit:
    runs-on: obtrace-runners
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maven
        run: |
          which mvn && exit 0
          MVN_VER=3.9.9
          wget -q "https://archive.apache.org/dist/maven/maven-3/${MVN_VER}/binaries/apache-maven-${MVN_VER}-bin.tar.gz"
          tar xzf "apache-maven-${MVN_VER}-bin.tar.gz"
          echo "${PWD}/apache-maven-${MVN_VER}/bin" >> "$GITHUB_PATH"
      - run: mvn -q -DskipTests org.owasp:dependency-check-maven:check
